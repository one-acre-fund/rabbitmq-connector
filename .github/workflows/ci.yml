name: "CI"

on:
  push:
    branches: [develop, v0, v1]
  pull_request:
    branches: [develop]
  schedule:
    # Weekly vuln/container scan on top of per-push runs.
    - cron: "0 22 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          # We must fetch at least the immediate parents so that if this is
          # a pull request then we can checkout the head.
          fetch-depth: 2
      # If this run was triggered by a pull request event, then checkout
      # the head of the pull request instead of the merge commit.
      - run: git checkout HEAD^2
        if: ${{ github.event_name == 'pull_request' }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.20.0
          cache: false

      - name: Build
        run: go build -v ./...

      - name: Test for Race Conditions
        run: go test -race ./...

      - name: Test with Coverage
        run: go test -coverprofile=coverage.txt -covermode=atomic -v ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          flags: unit-tests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: golangci-lint
        # Pre-existing findings in upstream code; report-only on the OAF fork
        # until a dedicated cleanup PR lands. Track in Linear.
        continue-on-error: true
        uses: golangci/golangci-lint-action@v3
        with:
          # Required: the version of golangci-lint is required and must be specified without patch version: we always use the latest patch version.
          version: v1.51.1
          # Optional: show only new issues if it's a pull request. The default value is `false`.
          only-new-issues: true

  vulncheck:
    name: Analyse Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Running govulncheck
        uses: Templum/govulncheck-action@v1.0.0

  container-scan:
    name: Analyse Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build an image from Dockerfile
        run: docker build -t rabbitmq-connector:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "rabbitmq-connector:${{ github.sha }}"
          format: 'sarif'
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        # OAF org uses GitHub's default CodeQL setup, which rejects SARIF uploads
        # from manual workflows. Keep the upload for upstream Templum only.
        if: github.repository_owner == 'Templum'
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: "trivy-results.sarif"
